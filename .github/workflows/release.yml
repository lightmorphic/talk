name: Release AppImage

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Pinned rather than ubuntu-latest: the AppImage bundles this
    # runner's glibc/GTK, so an older LTS here means the built
    # AppImage runs on more people's machines, not fewer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-dev python3-venv build-essential curl file \
            python3-gi python3-gi-cairo python3-cairo gir1.2-gtk-3.0 \
            gir1.2-ayatanaappindicator3-0.1 libayatana-appindicator3-1 \
            libportaudio2

      - name: Build AppImage
        run: ./scripts/build-appimage.sh

      - name: Verify the build actually runs
        run: |
          rm -rf ~/.local/share/talkin
          xvfb-run -a ./Talkin-x86_64.AppImage &
          pid=$!
          for _ in $(seq 1 30); do
            sleep 2
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "AppImage exited early — build is broken" >&2
              cat ~/.local/share/talkin/data/talkin.log 2>&1 || true
              exit 1
            fi
            grep -q "settings on" ~/.local/share/talkin/data/talkin.log 2>/dev/null && break
          done
          grep -q "settings on" ~/.local/share/talkin/data/talkin.log 2>/dev/null || {
            echo "settings server never started" >&2
            cat ~/.local/share/talkin/data/talkin.log 2>&1 || true
            exit 1
          }
          kill "$pid"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: Talkin-x86_64.AppImage
          fail_on_unmatched_files: true
