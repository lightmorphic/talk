name: Release AppImage

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Pinned rather than ubuntu-latest: the AppImage bundles this
    # runner's glibc/GTK, so an older LTS here means the built
    # AppImage runs on more people's machines, not fewer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-dev python3-venv build-essential curl file xvfb \
            python3-gi python3-gi-cairo python3-cairo gir1.2-gtk-3.0 \
            gir1.2-ayatanaappindicator3-0.1 libayatana-appindicator3-1 \
            libportaudio2

      - name: Build AppImage
        run: ./scripts/build-appimage.sh

      - name: Verify the build actually runs
        run: |
          rm -rf ~/.local/share/talkin
          xvfb-run -a ./Talkin-x86_64.AppImage &
          pid=$!
          for _ in $(seq 1 30); do
            sleep 2
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "AppImage exited early — build is broken" >&2
              cat ~/.local/share/talkin/data/talkin.log 2>&1 || true
              exit 1
            fi
            grep -q "Talkin is ready" ~/.local/share/talkin/data/talkin.log 2>/dev/null && break
          done
          grep -q "Talkin is ready" ~/.local/share/talkin/data/talkin.log 2>/dev/null || {
            echo "Talkin never finished starting up" >&2
            cat ~/.local/share/talkin/data/talkin.log 2>&1 || true
            exit 1
          }
          kill "$pid"

      # Two copies of the same file: the plain name is what the website
      # links to (via GitHub's /releases/latest/download/<name> URL, which
      # always serves whatever the newest release uploaded under that
      # exact name — so the site never needs editing for a new version),
      # and the versioned name is there so anyone browsing the Releases
      # page directly can tell what they downloaded.
      - name: Create versioned copy
        run: cp Talkin-x86_64.AppImage "Talkin-${{ github.ref_name }}-x86_64.AppImage"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Talkin-x86_64.AppImage
            Talkin-${{ github.ref_name }}-x86_64.AppImage
          fail_on_unmatched_files: true
